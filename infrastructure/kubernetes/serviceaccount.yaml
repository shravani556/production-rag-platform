apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-app
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: production-rag-platform
  # Future Vault authentication placeholder; this annotation does not authenticate.
  annotations:
    rag-platform.io/vault-authentication: "disabled"
automountServiceAccountToken: false
