apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-chroma-data
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: production-rag-platform
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: replace-with-storage-class
  resources:
    requests:
      storage: 20Gi
