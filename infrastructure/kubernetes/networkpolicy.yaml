apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-app
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: production-rag-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-app
      app.kubernetes.io/instance: rag-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              rag-platform.io/network-role: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ingress-controller
      ports:
        - protocol: TCP
          port: 8501
    - from:
        - namespaceSelector:
            matchLabels:
              rag-platform.io/network-role: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8501
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: production-rag-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: rag-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-app
              app.kubernetes.io/instance: rag-platform
      ports:
        - protocol: TCP
          port: 11434
