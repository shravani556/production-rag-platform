# Do not enable horizontal scaling above one replica until ChromaDB is replaced
# by shared, multi-writer-safe vector storage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-app
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: production-rag-platform
  annotations:
    rag-platform.io/requires-shared-vector-storage: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
