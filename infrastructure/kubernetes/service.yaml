apiVersion: v1
kind: Service
metadata:
  name: rag-app
  namespace: rag-platform
  labels:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: production-rag-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-app
    app.kubernetes.io/instance: rag-platform
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
