# Reference-only contract for a pinned metrics-server upstream chart.
enabled: false
chartReference: "metrics-server://approved-version-required"
namespaceReference: "namespace://kube-system"
replicas: 2
resources:
  requests: { cpu: 100m, memory: 200Mi }
  limits: { cpu: 250m, memory: 400Mi }
podDisruptionBudget: { enabled: true, minAvailable: 1 }
args:
  - --kubelet-preferred-address-types=InternalIP,InternalDNS,Hostname
  - --metric-resolution=15s
  - --kubelet-use-node-status-port
recommendedFlags:
  aggregationLayerRequired: true
  kubeletInsecureTlsPermitted: false
