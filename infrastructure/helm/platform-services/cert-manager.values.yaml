# Reference-only contract for a pinned cert-manager upstream chart.
enabled: false
chartReference: "cert-manager://approved-version-required"
namespaceReference: "namespace://cert-manager"
crds: { enabled: false }
replicaCount: 2
webhook:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
cainjector:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
prometheus: { enabled: true, servicemonitor: { enabled: false } }
leaderElection:
  namespaceReference: "namespace://cert-manager"
issuers: []
