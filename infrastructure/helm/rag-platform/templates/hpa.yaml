{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rag-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rag-platform.labels" . | nindent 4 }}
  annotations:
    rag-platform.io/requires-shared-vector-storage: "true"
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "rag-platform.fullname" . }} }
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.hpa.averageCPUUtilization }} } }
  behavior:
{{ toYaml .Values.hpa.behavior | nindent 4 }}
{{- end }}
