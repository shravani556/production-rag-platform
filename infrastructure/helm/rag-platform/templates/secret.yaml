{{- if .Values.secret.createDevelopmentPlaceholder }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rag-platform.labels" . | nindent 4 }}
  annotations:
    rag-platform.io/environment: development-only
{{- with .Values.secret.annotations }}
{{ toYaml . | nindent 4 }}
{{- end }}
type: Opaque
data: {}
{{- end }}
