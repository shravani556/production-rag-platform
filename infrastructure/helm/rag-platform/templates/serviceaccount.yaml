{{- if .Values.serviceAccount.create }}
{{- $annotations := deepCopy .Values.serviceAccount.annotations }}
{{- if and .Values.vaultIntegration.enabled .Values.vaultIntegration.authentication.enabled }}
{{- $annotations = mergeOverwrite $annotations .Values.vaultIntegration.authentication.serviceAccountAnnotations }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag-platform.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rag-platform.labels" . | nindent 4 }}
{{- with $annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
