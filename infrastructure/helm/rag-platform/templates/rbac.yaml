{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rag-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rag-platform.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rag-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "rag-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rag-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rag-platform.fullname" . }}
{{- end }}
