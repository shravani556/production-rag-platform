apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollama.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ollama.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
{{ toYaml .Values.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
{{ include "ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "ollama.labels" . | nindent 8 }}
{{- if and .Values.vaultIntegration.enabled .Values.vaultIntegration.agentInjector.enabled }}
{{- with .Values.vaultIntegration.agentInjector.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
    spec:
      serviceAccountName: {{ include "ollama.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: HOME, value: /tmp }
          ports: [{ name: http, containerPort: 11434, protocol: TCP }]
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          securityContext:
{{ toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: temporary-data, mountPath: /tmp }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-models" (include "ollama.fullname" .)) .Values.persistence.existingClaim }}
        - name: temporary-data
          emptyDir: { sizeLimit: {{ .Values.temporaryStorage.sizeLimit }} }
