{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ollama.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ollama.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "ollama.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ragAppPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 11434
{{- end }}
